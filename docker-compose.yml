services:
  web:
    image: ${WEB_IMAGE:-kurukin-asset-hub-web:job-bundle-materialization}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASSET_HUB_HOST: ${ASSET_HUB_HOST:-assets.kuruk.in}
      STACK_NAME: ${STACK_NAME:-kurukin-asset-hub}
      POSTGRES_DB: ${POSTGRES_DB:-kurukin_asset_hub}
      POSTGRES_USER: ${POSTGRES_USER:-asset_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://asset_hub:change-me@tasks.db:5432/kurukin_asset_hub}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ASSET_HUB_API_KEY: ${ASSET_HUB_API_KEY:-change-me}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/config/rclone/rclone.conf}
      PREVIEW_STORAGE_DIR: ${PREVIEW_STORAGE_DIR:-/data/previews}
      JOB_ASSETS_STORAGE_DIR: ${JOB_ASSETS_STORAGE_DIR:-/data/job-assets}
      JOB_ASSET_MATERIALIZATION_ENABLED: ${JOB_ASSET_MATERIALIZATION_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      AI_ENRICHMENT_ENABLED: ${AI_ENRICHMENT_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-}
      AI_FRAME_SAMPLE_COUNT: ${AI_FRAME_SAMPLE_COUNT:-8}
      AI_REVIEW_THRESHOLD: ${AI_REVIEW_THRESHOLD:-0.72}
      AI_MAX_ASSETS_PER_BATCH: ${AI_MAX_ASSETS_PER_BATCH:-20}
      LONG_VIDEO_SEGMENTATION_ENABLED: ${LONG_VIDEO_SEGMENTATION_ENABLED:-true}
      LONG_VIDEO_THRESHOLD_SECONDS: ${LONG_VIDEO_THRESHOLD_SECONDS:-30}
      SEGMENT_MIN_SECONDS: ${SEGMENT_MIN_SECONDS:-4}
      SEGMENT_TARGET_SECONDS: ${SEGMENT_TARGET_SECONDS:-8}
      SEGMENT_MAX_SECONDS: ${SEGMENT_MAX_SECONDS:-15}
      SEGMENT_SCENE_THRESHOLD: ${SEGMENT_SCENE_THRESHOLD:-0.32}
      SEGMENT_OUTPUT_MODE: ${SEGMENT_OUTPUT_MODE:-high_quality_encode}
      SEGMENT_OUTPUT_CRF: ${SEGMENT_OUTPUT_CRF:-17}
      SEGMENT_OUTPUT_PRESET: ${SEGMENT_OUTPUT_PRESET:-medium}
      SEGMENT_STRIP_AUDIO: ${SEGMENT_STRIP_AUDIO:-true}
      DERIVED_ASSET_CATEGORY_FOLDERS: ${DERIVED_ASSET_CATEGORY_FOLDERS:-women,men,couples,animals,family,business,nature,food,health,abstract,spiritual,other}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - /root/.config/rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - previews:/data/previews
      - job_assets:/data/job-assets
    networks:
      - asset_hub_internal
      - traefik_public
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        traefik.enable: "true"
        traefik.docker.network: traefik_public
        traefik.http.routers.asset-hub.rule: Host(`assets.kuruk.in`)
        traefik.http.routers.asset-hub.entrypoints: websecure
        traefik.http.routers.asset-hub.tls.certresolver: le
        traefik.http.services.asset-hub.loadbalancer.server.port: "8000"

  asset-worker:
    image: ${WEB_IMAGE:-kurukin-asset-hub-web:job-bundle-materialization}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/run_asset_pipeline_worker.py"]
    healthcheck:
      disable: true
    environment:
      STACK_NAME: ${STACK_NAME:-kurukin-asset-hub}
      POSTGRES_DB: ${POSTGRES_DB:-kurukin_asset_hub}
      POSTGRES_USER: ${POSTGRES_USER:-asset_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://asset_hub:change-me@tasks.db:5432/kurukin_asset_hub}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/config/rclone/rclone.conf}
      PREVIEW_STORAGE_DIR: ${PREVIEW_STORAGE_DIR:-/data/previews}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      AI_ENRICHMENT_ENABLED: ${AI_ENRICHMENT_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-}
      AI_OUTPUT_LANGUAGE: ${AI_OUTPUT_LANGUAGE:-es}
      AI_FRAME_SAMPLE_COUNT: ${AI_FRAME_SAMPLE_COUNT:-8}
      AI_REVIEW_THRESHOLD: ${AI_REVIEW_THRESHOLD:-0.72}
      AI_MAX_ASSETS_PER_BATCH: ${AI_MAX_ASSETS_PER_BATCH:-20}
      ASSET_PIPELINE_ENABLED: ${ASSET_PIPELINE_ENABLED:-true}
      ASSET_PIPELINE_POLL_SECONDS: ${ASSET_PIPELINE_POLL_SECONDS:-30}
      ASSET_PIPELINE_BATCH_SIZE: ${ASSET_PIPELINE_BATCH_SIZE:-10}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - /root/.config/rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - previews:/data/previews
    networks:
      - asset_hub_internal
    depends_on:
      - db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kurukin_asset_hub}
      POSTGRES_USER: ${POSTGRES_USER:-asset_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - asset_hub_postgres_data:/var/lib/postgresql/data
    networks:
      - asset_hub_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  asset_hub_internal:
    external: true
    name: kurukin-asset-hub_asset_hub_internal
  traefik_public:
    external: true
    name: traefik_public

volumes:
  asset_hub_postgres_data:
  previews:
  job_assets:
