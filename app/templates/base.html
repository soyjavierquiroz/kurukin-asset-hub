<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title or "Admin" }} - Kurukin Asset Hub</title>
    <link rel="stylesheet" href="/static/admin.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="/assets" class="brand">Managed Drive Asset Hub</a>
        <nav class="main-nav">
          <a href="/assets" {% if request.url.path.startswith('/assets') %}class="active"{% endif %}>Assets</a>
          <a href="/brands" {% if request.url.path.startswith('/brands') %}class="active"{% endif %}>Brands</a>
          <a href="/titles" {% if request.url.path.startswith('/titles') %}class="active"{% endif %}>Titles</a>
          <a href="/niches" {% if request.url.path.startswith('/niches') %}class="active"{% endif %}>Niches</a>
          <a href="/reviews" {% if request.url.path.startswith('/reviews') %}class="active"{% endif %}>Reviews</a>
        </nav>
        <nav class="secondary-nav">
          <a href="/">Dashboard</a>
          <a href="/sources">Sources</a>
          <a href="/products">Products</a>
        </nav>
      </div>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
