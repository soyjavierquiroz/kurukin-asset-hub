<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title or "Admin" }} - Kurukin Asset Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body class="min-h-screen bg-zinc-50 text-zinc-950">
    <header class="border-b border-zinc-200 bg-white">
      <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-4 sm:flex-row sm:items-center sm:justify-between">
        <a href="/" class="text-lg font-semibold tracking-normal text-zinc-950">Kurukin Asset Hub</a>
        <nav class="flex flex-wrap gap-1 text-sm font-medium text-zinc-600">
          <a class="rounded px-3 py-2 hover:bg-zinc-100 hover:text-zinc-950" href="/">Dashboard</a>
          <a class="rounded px-3 py-2 hover:bg-zinc-100 hover:text-zinc-950" href="/assets">Assets</a>
          <a class="rounded px-3 py-2 hover:bg-zinc-100 hover:text-zinc-950" href="/sources">Sources</a>
          <a class="rounded px-3 py-2 hover:bg-zinc-100 hover:text-zinc-950" href="/brands">Brands</a>
          <a class="rounded px-3 py-2 hover:bg-zinc-100 hover:text-zinc-950" href="/products">Products</a>
          <a class="rounded px-3 py-2 hover:bg-zinc-100 hover:text-zinc-950" href="/niches">Niches</a>
        </nav>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
