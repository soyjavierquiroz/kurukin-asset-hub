{% extends "base.html" %}

{% block content %}
  <div class="mb-6">
    <a class="text-sm font-medium text-zinc-600 hover:text-zinc-950" href="/products">Back to products</a>
    <h1 class="mt-3 text-2xl font-semibold tracking-normal">{{ page_title }}</h1>
  </div>

  <form class="max-w-2xl rounded border border-zinc-200 bg-white p-5" method="post" action="{{ '/products/' ~ product.id ~ '/edit' if product else '/products' }}">
    <div class="grid gap-4">
      <label class="text-sm font-medium text-zinc-700">Brand
        <select class="mt-1 w-full rounded border border-zinc-300 px-3 py-2 text-sm" name="brand_id" required>
          {% for brand in brands %}
            <option value="{{ brand.id }}" {% if product and product.brand_id == brand.id %}selected{% endif %}>{{ brand.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="text-sm font-medium text-zinc-700">Slug
        <input class="mt-1 w-full rounded border border-zinc-300 px-3 py-2 text-sm" name="slug" required value="{{ product.slug if product else '' }}">
      </label>
      <label class="text-sm font-medium text-zinc-700">Name
        <input class="mt-1 w-full rounded border border-zinc-300 px-3 py-2 text-sm" name="name" required value="{{ product.name if product else '' }}">
      </label>
      <label class="text-sm font-medium text-zinc-700">Description
        <textarea class="mt-1 min-h-28 w-full rounded border border-zinc-300 px-3 py-2 text-sm" name="description">{{ product.description if product else '' }}</textarea>
      </label>
      <label class="flex items-center gap-2 text-sm font-medium text-zinc-700">
        <input class="rounded border-zinc-300" type="checkbox" name="enabled" {% if product is none or product.enabled %}checked{% endif %}>
        Enabled
      </label>
    </div>
    <div class="mt-6 flex gap-2">
      <button class="rounded bg-zinc-950 px-4 py-2 text-sm font-medium text-white hover:bg-zinc-800" type="submit">Save</button>
      <a class="rounded border border-zinc-300 px-4 py-2 text-sm font-medium text-zinc-700 hover:bg-zinc-100" href="/products">Cancel</a>
    </div>
  </form>
{% endblock %}
