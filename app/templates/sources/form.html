{% extends "base.html" %}

{% block content %}
  <div class="mb-6">
    <a class="text-sm font-medium text-zinc-600 hover:text-zinc-950" href="/sources">Back to sources</a>
    <h1 class="mt-3 text-2xl font-semibold tracking-normal">{{ page_title }}</h1>
  </div>

  <form class="max-w-2xl rounded border border-zinc-200 bg-white p-5" method="post" action="{{ '/sources/' ~ source.id ~ '/edit' if source else '/sources' }}">
    <div class="grid gap-4">
      <label class="text-sm font-medium text-zinc-700">Source ID
        <input class="mt-1 w-full rounded border border-zinc-300 px-3 py-2 text-sm" name="source_id" required value="{{ source.source_id if source else '' }}">
      </label>
      <label class="text-sm font-medium text-zinc-700">Label
        <input class="mt-1 w-full rounded border border-zinc-300 px-3 py-2 text-sm" name="label" required value="{{ source.label if source else '' }}">
      </label>
      <label class="text-sm font-medium text-zinc-700">Provider
        <select class="mt-1 w-full rounded border border-zinc-300 px-3 py-2 text-sm" name="provider" required>
          {% for value in provider_values %}
            <option value="{{ value }}" {% if source and source.provider == value %}selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="text-sm font-medium text-zinc-700">Rclone remote
        <input class="mt-1 w-full rounded border border-zinc-300 px-3 py-2 text-sm" name="rclone_remote" value="{{ source.rclone_remote if source else '' }}">
      </label>
      <label class="text-sm font-medium text-zinc-700">Root path
        <input class="mt-1 w-full rounded border border-zinc-300 px-3 py-2 text-sm" name="root_path" value="{{ source.root_path if source else '' }}">
      </label>
      <label class="flex items-center gap-2 text-sm font-medium text-zinc-700">
        <input class="rounded border-zinc-300" type="checkbox" name="enabled" {% if source is none or source.enabled %}checked{% endif %}>
        Enabled
      </label>
    </div>
    <div class="mt-6 flex gap-2">
      <button class="rounded bg-zinc-950 px-4 py-2 text-sm font-medium text-white hover:bg-zinc-800" type="submit">Save</button>
      <a class="rounded border border-zinc-300 px-4 py-2 text-sm font-medium text-zinc-700 hover:bg-zinc-100" href="/sources">Cancel</a>
    </div>
  </form>
{% endblock %}
