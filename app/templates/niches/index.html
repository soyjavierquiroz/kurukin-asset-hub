{% extends "base.html" %}

{% block content %}
  <div class="page-head">
    <div>
      <h1>Niches</h1>
      <div class="countline"><span>{{ niches|length }} niches con assets</span></div>
    </div>
  </div>

  <section class="detail-panel">
    <div class="compact-list">
      {% for niche in niches %}
        <div class="list-row">
          <div>
            <div class="list-title">{{ niche.name or niche.slug }}</div>
            <div class="muted">{{ niche.slug }} · {{ niche.asset_count }} assets</div>
          </div>
          <div class="row-actions">
            <a class="button" href="/assets?niche={{ niche.slug }}">Ver assets</a>
          </div>
        </div>
      {% else %}
        <p class="muted">No hay niches asociados a assets todavía.</p>
      {% endfor %}
    </div>
  </section>
{% endblock %}
