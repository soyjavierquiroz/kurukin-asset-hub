{% extends "base.html" %}

{% block content %}
  <div class="mb-8 flex items-center justify-between">
    <h1 class="text-2xl font-semibold tracking-normal">Dashboard</h1>
  </div>

  <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-5">
    {% for label, count in counts.items() %}
      <div class="rounded border border-zinc-200 bg-white p-5">
        <div class="text-sm font-medium uppercase tracking-normal text-zinc-500">{{ label }}</div>
        <div class="mt-3 text-3xl font-semibold tracking-normal">{{ count }}</div>
      </div>
    {% endfor %}
  </section>
{% endblock %}
